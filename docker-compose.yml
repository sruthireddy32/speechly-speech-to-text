services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: speechly
      MYSQL_USER: speechly
      MYSQL_PASSWORD: speechly_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local_password"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://speechly:speechly_local_password@db:3306/speechly
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
